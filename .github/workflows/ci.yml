name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean install root dependencies (including optional dependencies)
        run: npm ci --include=optional
      - name: Verify release version metadata
        run: npm run verify:release-version
      - name: Build root TypeScript
        run: npm run build
      - name: Run persistence, policy, and delivery tests
        run: |
          npm run test:persistence
          npm run test:jinsha
          npm run test:windows-handoff-acceptance
          npm run test:deliverables

  desktop-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Clean install desktop dependencies
        run: npm ci --prefix desktop --include=optional
      - name: Run desktop source contracts
        run: npm run test:desktop-contracts

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Clean install website dependencies (including platform optional dependencies)
        run: npm ci --prefix website --include=optional
      - name: Typecheck website
        run: npm --prefix website run typecheck
      - name: Build website
        run: npm --prefix website run build