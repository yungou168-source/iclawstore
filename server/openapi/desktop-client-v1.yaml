openapi: 3.1.0
info:
  title: AI直聘桌面客户端 API
  version: 1.3.0
  description: |
    AI直聘桌面客户端的版本化生产契约，覆盖 Agent 形象、账号侧栏、桌面模板、
    会话能力协商、Jobs 与产物、面试、候选目录、企业人员以及付费招聘。

    重要：接口出现在本文档中只表示机器契约已定义，不等于生产业务已经启用。
    客户端必须先读取 GET /api/v1/desktop/contract 的 capabilities，再读取
    GET /api/v1/ai-direct-hiring/session 的组织功能开关与运行能力。
    手工填写 Bearer Token 仅用于接口调试，不代表 OAuth 登录已经发布。

    能力状态：available（生产已启用）、documented_disabled（已定义但关闭）、
    planned（规划中、尚未实现）、deprecated（兼容保留）。
servers:
  - url: https://www.iclawstore.com
    description: AI直聘生产环境
security:
  - bearerAuth: []
tags:
  - name: 契约发现
    description: 版本、能力状态与 OpenAPI 机器契约
  - name: Agent 形象
    description: Agent 头像、2D/3D 资产与展示控制
  - name: 雇佣关系
  - name: Offer 凭证
  - name: 桌面侧栏
  - name: 桌面模板
  - name: 会话
  - name: Jobs
  - name: 面试
  - name: 候选目录
  - name: 企业人员
  - name: 开发者发布
x-capability-status-definitions:
  available: 生产已经启用，仍须通过身份、组织权限和会话能力校验。
  documented_disabled: 契约已定义，但生产功能开关或运行配置关闭。
  planned: 规划能力，尚未形成可调用的生产接口。
  deprecated: 兼容保留能力，新客户端不得继续依赖。
x-capabilities:
  auth: { status: documented_disabled, reason: 生产 OAuth/OIDC + PKCE 配置尚未发布 }
  session: { status: available }
  agentAppearance: { status: available }
  desktopSidebar: { status: available }
  desktopTemplates: { status: available }
  desktopTemplatePurchase: { status: documented_disabled, reason: Desktop API v1 不支持模板购买 }
  paidHiring: { status: documented_disabled, reason: 支付与付费招聘生产门禁尚未开启 }
  jobs: { status: available }
  jobControl: { status: available }
  interviews: { status: available }
  candidateCatalog: { status: available }
  workforce: { status: available }
  agentPublication: { status: available }
  agentPublicationEditing:
    { status: planned, reason: Agent 单项读取、PATCH 编辑、归档、下架与回滚尚未形成完整桌面契约 }
  jinshaCredentialSync:
    { status: documented_disabled, reason: 仅在 Provider Runtime 与凭据密钥环配置完成后挂载 }
  jinshaModelPolicy: { status: planned }
  deviceManagement: { status: planned }
  realtimeEvents: { status: planned }
  teamMarketplace: { status: planned }
  localTrialMigration: { status: planned }
  messageChannels: { status: planned }
  persistentMemorySync: { status: planned }
  skinMarketplace: { status: planned }
  centralizedGovernance: { status: planned }
  legacyInterviewRead:
    status: deprecated
    replacedBy: PUT /api/v1/ai-direct-hiring/interviews/{conversationId}/read-cursor
paths:
  /api/v1/desktop/contract:
    get:
      tags: [契约发现]
      summary: 发现当前桌面客户端契约
      security: []
      operationId: getDesktopContract
      responses:
        "200":
          description: 契约元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractMetadata"
  /api/v1/desktop/openapi.yaml:
    get:
      tags: [契约发现]
      summary: 下载本 OpenAPI 文档
      security: []
      operationId: getDesktopOpenApi
      responses:
        "200":
          description: OpenAPI 3.1 YAML 文档
          content:
            application/vnd.oai.openapi:
              schema:
                type: string
  /api/v1/ai-direct-hiring/agents:
    get:
      tags: [开发者发布]
      summary: 查询当前开发者可管理的 Agent
      operationId: listDeveloperAgents
      responses:
        "200": { description: Agent 列表，最多 100 项 }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [开发者发布]
      summary: 创建 Agent 及其首个草稿版本
      operationId: createDeveloperAgent
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: false,
            schema: { type: string, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreateRequest" }
      responses:
        "201": { description: Agent 与首个草稿版本已创建 }
        "200": { description: 幂等重放返回既有 Agent }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/agents/{agentId}/versions:
    get:
      tags: [开发者发布]
      summary: 查询 Agent 版本历史
      operationId: listDeveloperAgentVersions
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 版本列表，最多 100 项 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [开发者发布]
      summary: 为 Agent 创建新的不可变版本草稿
      operationId: createDeveloperAgentVersion
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - {
            name: Idempotency-Key,
            in: header,
            required: false,
            schema: { type: string, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentVersionCreateRequest" }
      responses:
        "201": { description: Agent 版本草稿已创建 }
        "200": { description: 幂等重放返回既有版本 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/agent-versions/{versionId}/submit:
    post:
      tags: [开发者发布]
      summary: 提交 Agent 版本以供审核
      description: 命令型操作，不接受请求体；审核材料来自已保存的版本内容。
      operationId: submitDeveloperAgentVersion
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 版本已提交 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/agent-versions/{versionId}/review:
    post:
      tags: [开发者发布]
      summary: 审核 Agent 版本（平台管理员）
      operationId: reviewDeveloperAgentVersion
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                securityStatus: { type: string, enum: [approved, rejected], default: approved }
      responses:
        "200": { description: 审核裁决已记录 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/agent-versions/{versionId}/publish:
    post:
      tags: [开发者发布]
      summary: 发布已通过审核的 Agent 版本
      description: 命令型操作，不接受请求体；服务端根据已保存的审核与安全状态决定是否允许发布。
      operationId: publishDeveloperAgentVersion
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 版本已发布；重复调用返回 replayed }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/agents/{agentId}/appearance:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [Agent 形象]
      summary: 读取 Agent 形象及当前写入权限
      operationId: getAgentAppearance
      responses:
        "200":
          description: Agent 形象配置
          headers:
            ETag:
              $ref: "#/components/headers/AppearanceEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAppearance"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agent 形象]
      summary: 更新头像引用或默认展示模式
      operationId: updateAgentAppearance
      parameters:
        - $ref: "#/components/parameters/AppearanceIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAppearancePatch"
      responses:
        "200":
          description: 更新后的修订版本
          headers:
            ETag:
              $ref: "#/components/headers/AppearanceEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/ai-direct-hiring/agents/{agentId}/appearance/assets:
    post:
      tags: [Agent 形象]
      summary: 上传 Agent 形象资产
      operationId: uploadAgentAppearanceAsset
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/AppearanceIfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [avatar, image_2d, model_3d]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 已存储的资产
          headers:
            ETag:
              $ref: "#/components/headers/AppearanceEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppearanceAsset"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/AssetTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/ai-direct-hiring/agents/{agentId}/appearance/assets/reorder:
    post:
      tags: [Agent 形象]
      summary: 替换同类形象资产的完整排序
      operationId: reorderAgentAppearanceAssets
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/AppearanceIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, assetIds]
              properties:
                kind:
                  type: string
                  enum: [image_2d, model_3d]
                assetIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: 新排序和修订版本
          headers:
            ETag:
              $ref: "#/components/headers/AppearanceEtag"
          content:
            application/json:
              schema:
                type: object
                required: [kind, assetIds, revision]
                properties:
                  kind: { type: string, enum: [image_2d, model_3d] }
                  assetIds:
                    type: array
                    items: { type: string, format: uuid }
                  revision: { type: string, pattern: "^[0-9]+$" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/ai-direct-hiring/agents/{agentId}/appearance/assets/{assetId}:
    delete:
      tags: [Agent 形象]
      summary: 软删除形象资产
      operationId: deleteAgentAppearanceAsset
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/AppearanceIfMatch"
      responses:
        "204": { description: 资产已删除 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/ai-direct-hiring/appearance-assets/{assetId}/content:
    get:
      tags: [Agent 形象]
      summary: 读取有效的形象资产内容
      operationId: getAgentAppearanceAssetContent
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: PNG、JPEG、WebP 或自包含的 GLB 二进制内容
          headers:
            ETag: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            model/gltf-binary: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/agents/{agentId}/prices:
    get:
      tags: [Offer 凭证]
      summary: 查询当前开发者的不可变价格历史
      operationId: listAgentHiringPrices
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 价格版本列表，按最新优先排序 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [Offer 凭证]
      summary: 为已发布 Agent 版本设置开发者拥有的人民币招聘价格
      operationId: setAgentHiringPrice
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentVersionId, amountFen]
              properties:
                agentVersionId: { type: string, maxLength: 36 }
                amountFen: { type: string, pattern: "^[0-9]+$" }
                currency: { type: string, const: CNY }
      responses:
        "201": { description: 新的有效不可变价格版本 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/paid-hiring/orders:
    post:
      tags: [Offer 凭证]
      summary: 根据服务端价格创建幂等的支付宝招聘订单
      operationId: createPaidHiringOrder
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyId, roleId, positionId, agentId]
              properties:
                companyId: { type: string, maxLength: 36 }
                projectId: { type: [string, "null"], maxLength: 36 }
                roleId: { type: string, maxLength: 36 }
                positionId: { type: string, maxLength: 36 }
                agentId: { type: string, maxLength: 36 }
      responses:
        "201": { description: 待支付的支付宝订单，包含服务端签名的 payUrl }
        "200": { description: 返回同一幂等键对应的待支付订单 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: 支付宝商户配置不可用 }
  /api/v1/ai-direct-hiring/paid-hiring/orders/{orderId}:
    get:
      tags: [Offer 凭证]
      summary: 查询请求者的本地支付状态和履约引用
      operationId: getPaidHiringOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 仅返回本地订单状态，不向支付渠道发起请求 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/paid-hiring/orders/{orderId}/reconcile:
    post:
      tags: [Offer 凭证]
      summary: 执行一次受冷却时间限制的服务端支付宝对账
      description: 命令型操作，不接受请求体；服务端使用订单快照和支付渠道配置执行查询。
      operationId: reconcilePaidHiringOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 更新后的本地订单状态 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: 对账冷却时间尚未结束 }
        "503": { description: 支付宝商户配置不可用 }
  /api/v1/ai-direct-hiring/offers:
    get:
      tags: [Offer 凭证]
      summary: 查询支付验证履约后生成的不可变 Offer 凭证
      operationId: listIssuedOffers
      responses:
        "200": { description: 当前组织成员可见的已签发 Offer 凭证 }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/ai-direct-hiring/offers/{offerId}:
    get:
      tags: [Offer 凭证]
      summary: 读取不可变 Offer 凭证及其支付分账
      operationId: getIssuedOffer
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { description: 已签发的 Offer 凭证 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/employments/{employmentId}/transition:
    post:
      tags: [雇佣关系]
      summary: 转换雇佣状态并原子同步形象控制权
      description: |
        进入 accepted 状态时，会在同一 MySQL 事务中取得 Agent 形象控制权。
        进入 terminated 状态时，仅当该雇佣关系仍持有控制权才会释放。
      operationId: transitionEmployment
      parameters:
        - $ref: "#/components/parameters/EmploymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentTransitionRequest"
      responses:
        "200":
          description: 已提交事务后的雇佣关系
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 状态转换无效，或 Agent 形象已被其他雇佣关系控制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/desktop/sidebar:
    get:
      tags: [桌面侧栏]
      summary: 读取账号级侧栏覆盖配置
      operationId: getDesktopSidebar
      responses:
        "200":
          description: 当前覆盖配置，或修订号为零的默认标记
          headers:
            ETag:
              $ref: "#/components/headers/SidebarEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidebarPreference"
        "401": { $ref: "#/components/responses/AuthRequired" }
    put:
      tags: [桌面侧栏]
      summary: 替换账号级侧栏覆盖配置
      operationId: putDesktopSidebar
      parameters:
        - $ref: "#/components/parameters/SidebarIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SidebarConfig"
      responses:
        "200":
          description: 已保存的覆盖配置
          headers:
            ETag:
              $ref: "#/components/headers/SidebarEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidebarPreference"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [桌面侧栏]
      summary: 删除覆盖配置并恢复客户端默认值
      operationId: resetDesktopSidebar
      parameters:
        - $ref: "#/components/parameters/SidebarIfMatch"
      responses:
        "204":
          description: 覆盖配置已删除；响应 ETag 为 sidebar-0
          headers:
            ETag:
              $ref: "#/components/headers/SidebarEtag"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/desktop/sidebar/icons:
    post:
      tags: [桌面侧栏]
      summary: 上传账号拥有的侧栏图标
      operationId: uploadDesktopSidebarIcon
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: 已存储的图标元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedAsset"
        "401": { $ref: "#/components/responses/AuthRequired" }
        "413": { $ref: "#/components/responses/AssetTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/v1/desktop/sidebar/icons/{assetId}/content:
    get:
      tags: [桌面侧栏]
      summary: 读取当前账号拥有的图标内容
      operationId: getDesktopSidebarIconContent
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: 图片二进制内容
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/desktop/sidebar/icons/{assetId}:
    delete:
      tags: [桌面侧栏]
      summary: 删除未使用的账号图标
      operationId: deleteDesktopSidebarIcon
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "204": { description: 图标已删除 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/desktop/templates:
    get:
      tags: [桌面模板]
      summary: 查询已发布的桌面模板
      operationId: listDesktopTemplates
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
      responses:
        "200":
          description: 已发布的模板；v1 中 purchaseSupported 始终为 false
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, purchaseSupported]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DesktopTemplate" }
                  limit: { type: integer }
                  offset: { type: integer }
                  purchaseSupported: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [桌面模板]
      summary: 创建 Publisher 拥有的模板草稿
      operationId: createDesktopTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplate"
      responses:
        "201": { description: 模板草稿已创建 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/desktop/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [桌面模板]
      summary: 读取已发布或当前账号拥有的模板
      operationId: getDesktopTemplate
      responses:
        "200":
          description: 模板详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopTemplate" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [桌面模板]
      summary: 更新当前账号拥有的模板草稿
      operationId: updateDesktopTemplateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplate"
      responses:
        "200": { description: 草稿已更新 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/desktop/templates/{templateId}/versions:
    post:
      tags: [桌面模板]
      summary: 为模板草稿上传已校验的 .clawtemplate 包
      operationId: uploadDesktopTemplateVersion
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: 草稿版本已创建 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "413": { $ref: "#/components/responses/AssetTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/v1/desktop/templates/{templateId}/versions/{versionId}/screenshots:
    post:
      tags: [桌面模板]
      summary: 上传 1–4 张模板截图中的一张
      operationId: uploadDesktopTemplateScreenshot
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/VersionId"
        - name: sortOrder
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 3 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: 截图已存储 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/desktop/templates/{templateId}/versions/{versionId}/submit:
    post:
      tags: [桌面模板]
      summary: 提交完整模板草稿版本以供审核
      description: 命令型操作，不接受请求体；服务端校验已保存的模板包、manifest 与 1–4 张截图。
      operationId: submitDesktopTemplateVersion
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200": { description: 版本已进入待审核状态 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/desktop/templates/{templateId}/versions/{versionId}/approve:
    post:
      tags: [桌面模板]
      summary: 审批并发布已提交的模板版本（平台管理员）
      description: 审核身份和结果由服务端上下文确定，可选 reason 会写入审核记录。
      operationId: approveDesktopTemplateVersion
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200": { description: 版本已发布 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/desktop/templates/{templateId}/package:
    get:
      tags: [桌面模板]
      summary: 下载免费或已获权益的已发布模板包
      operationId: downloadDesktopTemplatePackage
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: .clawtemplate ZIP 压缩包
          headers:
            Content-Disposition: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/zip: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/EntitlementRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/desktop/template-screenshots/{assetId}/content:
    get:
      tags: [桌面模板]
      summary: 读取已发布模板的截图
      operationId: getDesktopTemplateScreenshot
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200": { description: 截图二进制内容 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/desktop/templates/{templateId}/entitlements/{userId}:
    put:
      tags: [桌面模板]
      summary: 授予测试或管理权益（平台管理员）
      operationId: grantDesktopTemplateEntitlement
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reference: { type: [string, "null"], maxLength: 191 }
      responses:
        "200": { description: 权益已生效 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    delete:
      tags: [桌面模板]
      summary: 撤销模板权益（平台管理员）
      operationId: revokeDesktopTemplateEntitlement
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: 权益已撤销 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/session:
    get:
      tags: [会话]
      summary: 解析桌面端身份、组织范围和已启用能力
      operationId: getDesktopSession
      parameters:
        - { name: X-Organization-Id, in: header, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: 服务端确定的桌面会话范围
          content: { application/json: { schema: { $ref: "#/components/schemas/DesktopSession" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/ai-direct-hiring/jobs:
    get:
      tags: [Jobs]
      summary: 使用稳定游标查询组织 Jobs
      operationId: listDesktopJobs
      parameters:
        - {
            name: organizationId,
            in: query,
            required: true,
            schema: { type: string, maxLength: 36 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, description: 以逗号分隔的状态列表, schema: { type: string } }
      responses:
        "200":
          description: Jobs 游标分页，按最新运行优先排序
          content: { application/json: { schema: { $ref: "#/components/schemas/JobPage" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/ai-direct-hiring/jobs/{runId}:
    get:
      tags: [Jobs]
      summary: 读取 Job 及其有序步骤投影
      operationId: getDesktopJob
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: Job 详情
          content: { application/json: { schema: { $ref: "#/components/schemas/JobDetail" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/jobs/{runId}/cancel:
    post:
      tags: [Jobs]
      summary: 取消排队中或运行中的 Job
      description: 必须提供取消原因；成功后 Job 进入不可逆的 cancelled 终态。
      operationId: cancelDesktopJob
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Job 已取消 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/jobs/{runId}/retry:
    post:
      tags: [Jobs]
      summary: 重试失败或已取消的 Job
      description: 服务端使用原始输入克隆一个新的排队 Job，原 Job 保持不可变。
      operationId: retryDesktopJob
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "201": { description: 新 Job 已创建 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/jobs/{runId}/artifacts:
    get:
      tags: [Jobs]
      summary: 查询可见的 Job 产物元数据（不含存储路径）
      operationId: listDesktopJobArtifacts
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: 包含已授权内容 URL 的产物元数据
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [items],
                      properties:
                        {
                          items:
                            { type: array, items: { $ref: "#/components/schemas/JobArtifact" } },
                        },
                    },
                },
            }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/jobs/{runId}/artifacts/{artifactId}/content:
    get:
      tags: [Jobs]
      summary: 通过可见性授权后下载已校验的产物
      operationId: downloadDesktopJobArtifact
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 已校验的产物二进制流
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: 产物下载已禁用 }
  /api/v1/ai-direct-hiring/interviews:
    post:
      tags: [面试]
      summary: 创建组织范围的远程面试会话
      operationId: createInterviewConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId, agentVersionId]
              properties:
                organizationId: { type: string, maxLength: 36 }
                agentVersionId: { type: string, maxLength: 36 }
                participantUserIds:
                  { type: array, maxItems: 20, items: { type: string, maxLength: 191 } }
      responses:
        "201": { description: 会话已创建 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/interviews/{conversationId}/model-consent:
    put:
      tags: [面试]
      summary: 允许参与者退出组织启用的远程模型处理
      operationId: updateInterviewModelConsent
      parameters:
        - {
            name: conversationId,
            in: path,
            required: true,
            schema: { type: string, maxLength: 36 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [optedOut]
              properties: { optedOut: { type: boolean } }
      responses:
        "200": { description: 模型处理同意设置已更新 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/interviews/{conversationId}/messages:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    get:
      tags: [面试]
      summary: 使用单调序列游标增量同步面试消息
      operationId: listInterviewMessages
      parameters:
        - { name: afterSequence, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200": { description: 按序排列的消息；已删除消息的正文为 null }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [面试]
      summary: 追加保留期为 90 天的纯文本面试消息
      operationId: createInterviewMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties: { body: { type: string, minLength: 1, maxLength: 10000 } }
      responses:
        "201": { description: 消息已追加 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/interviews/{conversationId}/messages/{messageId}:
    delete:
      tags: [面试]
      summary: 隐藏调用者消息，并在法务保留约束下排队删除
      operationId: deleteInterviewMessage
      parameters:
        - {
            name: conversationId,
            in: path,
            required: true,
            schema: { type: string, maxLength: 36 },
          }
        - { name: messageId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "204": { description: 消息已隐藏并已请求删除 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/interviews/{conversationId}/read-cursor:
    put:
      tags: [面试]
      summary: 单调推进调用者的已读游标
      operationId: advanceInterviewReadCursor
      parameters:
        - {
            name: conversationId,
            in: path,
            required: true,
            schema: { type: string, maxLength: 36 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sequence]
              properties: { sequence: { type: integer, minimum: 0 } }
      responses:
        "200": { description: 已读游标已推进 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/interview-retention-policies/{organizationId}:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    get:
      tags: [面试]
      summary: 读取组织的面试数据保留策略
      operationId: getInterviewRetentionPolicy
      responses:
        "200":
          {
            description: 默认保留 90 天文本、组织默认启用模型处理，并允许最大 10 MiB 的图片或 PDF 附件,
          }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    put:
      tags: [面试]
      summary: 确认固定的 v1 面试数据保留策略
      operationId: putInterviewRetentionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bodyRetentionDays, modelConsentMode, attachmentPolicy, attachmentMaxBytes]
              properties:
                bodyRetentionDays: { type: integer, const: 90 }
                modelConsentMode: { type: string, const: organization_default_opt_in }
                attachmentPolicy: { type: string, const: image_pdf_only }
                attachmentMaxBytes: { type: integer, const: 10485760 }
      responses:
        "200": { description: 策略已确认 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/interview-legal-holds:
    post:
      tags: [面试]
      summary: 为会话或消息创建组织管理员法务保留
      operationId: createInterviewLegalHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId, reason]
              anyOf:
                - required: [conversationId]
                - required: [messageId]
              properties:
                organizationId: { type: string, minLength: 1, maxLength: 36 }
                conversationId: { type: string, minLength: 1, maxLength: 36 }
                messageId: { type: string, minLength: 1, maxLength: 36 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201": { description: 法务保留已创建 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/interview-legal-holds/{holdId}:
    delete:
      tags: [面试]
      summary: 解除有效的组织管理员法务保留
      operationId: releaseInterviewLegalHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "204": { description: 法务保留已解除 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/catalog/agents:
    get:
      tags: [候选目录]
      summary: 查询所选组织可见且字段安全的候选 Agent
      operationId: listCandidateCatalogAgents
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, maxLength: 36 },
          }
        - { name: category, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200": { description: 基于摘要的候选分页；不包含 Prompt、执行策略、审核备注和雇佣记录 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/catalog/agents/{agentId}:
    get:
      tags: [候选目录]
      summary: 读取带组织范围披露的候选 Agent
      operationId: getCandidateCatalogAgent
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, maxLength: 36 },
          }
      responses:
        "200": { description: 基于摘要的候选详情 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai-direct-hiring/catalog/categories:
    get:
      tags: [候选目录]
      summary: 查询候选分类及可见候选数量
      operationId: listCandidateCatalogCategories
      parameters:
        - {
            name: X-Organization-Id,
            in: header,
            required: false,
            schema: { type: string, maxLength: 36 },
          }
      responses:
        "200": { description: 基于摘要的分类数量 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/workforce/employees:
    get:
      tags: [企业人员]
      summary: 从企业人员摘要中查询当前 AI 员工
      description: >-
        需要 companyId 对应企业的招聘人员级权限。此接口仅读取当前雇佣关系摘要，
        不读取候选目录，并排除 Prompt、模型策略、凭据、执行记录和审计数据。
      operationId: listWorkforceEmployees
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, maxLength: 36 } }
        - {
            name: departmentId,
            in: query,
            required: false,
            schema: { type: string, maxLength: 36 },
          }
        - { name: positionId, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200": { description: 企业范围的员工摘要分页，使用不透明的 updatedAt/employmentId 游标 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/workforce/departments:
    get:
      tags: [企业人员]
      summary: 使用不透明游标查询企业部门
      operationId: listWorkforceDepartments
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, maxLength: 36 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: 企业范围的部门分页 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [企业人员]
      summary: 创建企业所属部门
      operationId: createWorkforceDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyId, name]
              properties:
                companyId: { type: string, minLength: 1, maxLength: 36 }
                name: { type: string, minLength: 1, maxLength: 160 }
                sortOrder: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        "201": { description: 部门已创建 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/workforce/departments/{departmentId}:
    patch:
      tags: [企业人员]
      summary: 更新部门信息或转换部门状态
      operationId: updateWorkforceDepartment
      parameters:
        - { name: departmentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                sortOrder: { type: integer, minimum: 0, maximum: 1000000 }
                toStatus: { type: string, enum: [active, inactive, archived] }
      responses:
        "200": { description: 部门已更新 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/workforce/positions:
    get:
      tags: [企业人员]
      summary: 使用不透明游标查询部门岗位
      operationId: listWorkforcePositions
      parameters:
        - { name: departmentId, in: query, required: true, schema: { type: string, maxLength: 36 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: 部门范围的岗位分页，包含编制人数投影 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [企业人员]
      summary: 创建草稿岗位
      operationId: createWorkforcePosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [departmentId, name]
              properties:
                departmentId: { type: string, minLength: 1, maxLength: 36 }
                name: { type: string, minLength: 1, maxLength: 160 }
                headcountTarget: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
                requirementsSummary: { type: object }
                sortOrder: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        "201": { description: 岗位已创建 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /api/v1/ai-direct-hiring/workforce/positions/{positionId}:
    patch:
      tags: [企业人员]
      summary: 更新岗位信息或转换岗位状态
      operationId: updateWorkforcePosition
      parameters:
        - { name: positionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                headcountTarget: { type: integer, minimum: 1, maximum: 1000000 }
                requirementsSummary: { type: object }
                sortOrder: { type: integer, minimum: 0, maximum: 1000000 }
                toStatus: { type: string, enum: [draft, open, paused, closed, archived] }
      responses:
        "200": { description: 岗位已更新 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai-direct-hiring/workforce/positions/{positionId}/candidate-matches:
    get:
      tags: [候选目录, 企业人员]
      summary: 为已授权开放岗位匹配字段安全的候选 Agent
      description: >-
        需要岗位所属企业的招聘人员级权限，且所属组织必须启用 candidateCatalog。
        服务端从岗位推导组织范围，客户端无法覆盖。响应仅包含摘要安全字段和
        当前查看者范围内的雇佣披露。
      operationId: listPositionCandidateMatches
      parameters:
        - { name: positionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200": { description: 候选摘要匹配结果，包含能力覆盖评分、查看者范围的雇佣披露和不透明游标 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgentId: { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    EmploymentId:
      { name: employmentId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    TemplateId:
      { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, maxLength: 191 } }
    AppearanceIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"appearance-[0-9]+"$' }
      example: '"appearance-3"'
    SidebarIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"sidebar-[0-9]+"$' }
      example: '"sidebar-2"'
  headers:
    AppearanceEtag:
      description: Agent 形象修订版本的强乐观并发控制标签
      schema: { type: string, pattern: '^"appearance-[0-9]+"$' }
    SidebarEtag:
      description: 侧栏修订版本的强乐观并发控制标签
      schema: { type: string, pattern: '^"sidebar-[0-9]+"$' }
  schemas:
    CapabilityStatus:
      type: string
      enum: [available, documented_disabled, planned, deprecated]
    CapabilityDescriptor:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/CapabilityStatus" }
        reason: { type: string }
        replacedBy: { type: string }
    AgentCreateRequest:
      type: object
      additionalProperties: false
      required: [name, promptSpec, modelPolicy]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        publisherId: { type: string, minLength: 1, maxLength: 191 }
        promptSpec:
          type: object
          description: 私有 Prompt 定义，仅用于受控执行和审核，不进入公开候选目录。
        modelPolicy:
          type: object
          description: AgentVersion 模型策略；服务端会在提交与运行前重新校验。
    AgentVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [promptSpec, modelPolicy]
      properties:
        promptSpec: { type: object }
        modelPolicy: { type: object }
        executionPolicy: { type: object, default: {} }
    ContractMetadata:
      type: object
      required:
        [
          contract,
          product,
          version,
          openapi,
          documentation,
          capabilityStatusDefinitions,
          capabilities,
          purchaseSupported,
          paidHiringSupported,
        ]
      properties:
        contract: { type: string, const: ai-direct-hiring-desktop-client }
        product: { type: string, const: AI直聘 }
        version: { type: string, const: 1.3.0 }
        openapi: { type: string }
        documentation: { type: string }
        capabilityStatusDefinitions:
          type: object
          additionalProperties: { type: string }
        capabilities:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CapabilityDescriptor" }
        purchaseSupported:
          type: boolean
          const: false
          deprecated: true
          description: 兼容旧客户端；新客户端应读取 capabilities.desktopTemplatePurchase。
        paidHiringSupported:
          type: boolean
          default: false
          deprecated: true
          description: 兼容旧客户端；新客户端应读取 capabilities.paidHiring。
        auth:
          description: 仅当 capabilities.auth.status 为 available 时返回完整元数据。
          $ref: "#/components/schemas/DesktopAuthDiscovery"
    DesktopAuthDiscovery:
      type: object
      additionalProperties: false
      required:
        [
          issuer,
          authorizationEndpoint,
          tokenEndpoint,
          userinfoEndpoint,
          jwksUri,
          revocationEndpoint,
          clientId,
          audience,
          redirectUris,
          scopes,
          pkceMethods,
        ]
      properties:
        issuer: { type: string, format: uri }
        authorizationEndpoint: { type: string, format: uri }
        tokenEndpoint: { type: string, format: uri }
        userinfoEndpoint: { type: string, format: uri }
        jwksUri: { type: string, format: uri }
        revocationEndpoint: { type: string, format: uri }
        clientId: { type: string, minLength: 1 }
        audience: { type: string, format: uri }
        redirectUris:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uri }
        scopes:
          type: array
          items: { type: string }
        pkceMethods:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [S256] }
    DesktopSession:
      type: object
      required:
        [
          user,
          organizations,
          currentOrganization,
          organizationSelection,
          featureFlags,
          runtimeCapabilities,
        ]
      properties:
        user:
          type: object
          required: [id, convexUserId, email, name, handle, displayName, image, role]
          properties:
            id: { type: string }
            convexUserId: { type: string }
            email: { type: [string, "null"], format: email }
            name: { type: [string, "null"] }
            handle: { type: [string, "null"] }
            displayName: { type: [string, "null"] }
            image: { type: [string, "null"], format: uri }
            role: { type: string }
        organizations:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OrganizationScope" }
        currentOrganization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationScope"
            - type: "null"
        organizationSelection:
          type: object
          required: [requestedOrganizationId, resolvedOrganizationId, source]
          properties:
            requestedOrganizationId: { type: [string, "null"] }
            resolvedOrganizationId: { type: [string, "null"] }
            source: { type: string, enum: [requested, default] }
        featureFlags: { $ref: "#/components/schemas/DesktopFeatureFlags" }
        runtimeCapabilities: { $ref: "#/components/schemas/DesktopRuntimeCapabilities" }
    OrganizationScope:
      type: object
      required: [id, name, slug, role, permissions, grantVersion]
      properties:
        id: { type: string, maxLength: 36 }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, manager, member] }
        permissions:
          type: array
          items: { type: string }
        grantVersion:
          type: string
          minLength: 1
    DesktopFeatureFlags:
      type: object
      required:
        [
          aiDirectHiring,
          desktopIdentityBridge,
          wechatLogin,
          desktopJobs,
          candidateCatalog,
          interviews,
          providerExecution,
        ]
      additionalProperties: { type: boolean }
      properties:
        aiDirectHiring: { type: boolean }
        desktopIdentityBridge: { type: boolean }
        wechatLogin: { type: boolean }
        desktopJobs: { type: boolean }
        candidateCatalog: { type: boolean, default: false }
        interviews: { type: boolean, default: false }
        providerExecution: { type: boolean, default: false }
    DesktopRuntimeCapabilities:
      type: object
      required: [desktopJobs, artifactDownload, candidateCatalog, interviews, providerExecution]
      additionalProperties: false
      properties:
        desktopJobs: { type: boolean }
        artifactDownload: { type: boolean }
        candidateCatalog: { type: boolean }
        interviews: { type: boolean }
        providerExecution: { type: boolean }
    JobPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
        nextCursor: { type: [string, "null"] }
    JobSummary:
      type: object
      required:
        [
          runId,
          workflowKey,
          status,
          requestedByUserId,
          stepCount,
          completedSteps,
          failedSteps,
          createdAt,
          startedAt,
          finishedAt,
          failureCode,
        ]
      properties:
        runId: { type: string, maxLength: 36 }
        workflowKey: { type: string }
        status: { type: string, enum: [queued, active, succeeded, failed, cancelled] }
        requestedByUserId: { type: string }
        employmentId: { type: [string, "null"] }
        agentVersionId: { type: [string, "null"] }
        stepCount: { type: integer, minimum: 0 }
        completedSteps: { type: integer, minimum: 0 }
        failedSteps: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        failureCode: { type: [string, "null"] }
    JobStep:
      type: object
      required:
        [
          stepId,
          stepKey,
          sequence,
          status,
          startedAt,
          finishedAt,
          latencyMs,
          costMicros,
          failureCode,
          outputSummary,
        ]
      properties:
        stepId: { type: string, maxLength: 36 }
        stepKey: { type: string }
        sequence: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, running, succeeded, failed, skipped] }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        latencyMs: { type: [integer, "null"], minimum: 0 }
        costMicros: { type: [string, "null"], pattern: "^[0-9]+$" }
        failureCode: { type: [string, "null"] }
        outputSummary: { type: [object, "null"] }
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          required: [steps, inputSummary, outputIndex, failureReason, leaseOwner, leaseExpiresAt]
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/JobStep" } }
            inputSummary: { type: [object, "null"] }
            outputIndex: { type: [object, "null"] }
            failureReason: { type: [string, "null"] }
            leaseOwner: { type: [string, "null"] }
            leaseExpiresAt: { type: [string, "null"], format: date-time }
    JobArtifact:
      type: object
      required:
        [artifactId, runId, kind, mimeType, sizeBytes, sha256, visibility, createdAt, contentUrl]
      properties:
        artifactId: { type: string, format: uuid }
        runId: { type: string, maxLength: 36 }
        kind: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        visibility: { type: string, enum: [organization, requester] }
        createdAt: { type: string, format: date-time }
        contentUrl: { type: string }
    Error:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            [
              AUTH_REQUIRED,
              FORBIDDEN_SCOPE,
              NOT_FOUND,
              VALIDATION_ERROR,
              INVALID_TRANSITION,
              RUN_NOT_RECOVERABLE,
              RUNTIME_CAPABILITY_DISABLED,
              APPEARANCE_CONTROL_CONFLICT,
              ASSET_LIMIT_EXCEEDED,
              ASSET_TOO_LARGE,
              UNSUPPORTED_MEDIA_TYPE,
              ASSET_IN_USE,
              REVISION_CONFLICT,
              PRECONDITION_REQUIRED,
              TEMPLATE_ENTITLEMENT_REQUIRED,
              TEMPLATE_NOT_INSTALLABLE,
              DUPLICATE_ENTRY,
              INTERNAL_ERROR,
            ]
        error: { type: string }
        details: {}
    EmploymentTransitionRequest:
      type: object
      additionalProperties: false
      required: [toStatus]
      properties:
        toStatus:
          type: string
          enum:
            [
              candidate,
              evaluating,
              offer_pending,
              offered,
              accepted,
              onboarding,
              active,
              paused,
              offboarding,
              terminated,
            ]
        reason: { type: string, maxLength: 500 }
        approvalId: { type: string, maxLength: 36 }
    Employment:
      type: object
      required: [id, companyId, agentId, roleId, status]
      properties:
        id: { type: string, maxLength: 36 }
        companyId: { type: string, maxLength: 36 }
        agentId: { type: string, maxLength: 36 }
        agentVersionId: { type: string, maxLength: 36 }
        roleId: { type: string, maxLength: 36 }
        projectId: { type: [string, "null"], maxLength: 36 }
        offerId: { type: string, maxLength: 36 }
        status:
          type: string
          enum:
            [
              candidate,
              evaluating,
              offer_pending,
              offered,
              accepted,
              onboarding,
              active,
              paused,
              offboarding,
              terminated,
            ]
        roleName: { type: string }
        companyName: { type: string }
        startedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Revision:
      type: object
      required: [revision]
      properties:
        revision: { type: string, pattern: "^[0-9]+$" }
    ManagedAsset:
      type: object
      required: [id, mimeType, sizeBytes, sha256, contentUrl]
      properties:
        id: { type: string, format: uuid }
        mimeType: { type: string }
        sizeBytes: { type: [string, integer] }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        contentUrl: { type: string }
    AppearanceAsset:
      allOf:
        - $ref: "#/components/schemas/ManagedAsset"
        - type: object
          required: [kind, sortOrder, createdAt]
          properties:
            kind: { type: string, enum: [avatar, image_2d, model_3d] }
            sortOrder: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
    AgentAppearancePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        avatarAssetId: { type: [string, "null"], format: uuid }
        defaultMode: { type: string, enum: [image_2d, model_3d] }
    AgentAppearance:
      type: object
      required: [agentId, avatarAssetId, defaultMode, revision, control, assets, presentation]
      properties:
        agentId: { type: string, format: uuid }
        avatarAssetId: { type: [string, "null"], format: uuid }
        defaultMode: { type: string, enum: [image_2d, model_3d] }
        revision: { type: string, pattern: "^[0-9]+$" }
        control:
          type: object
          required:
            [controllerEmploymentId, controllerCompanyId, canWrite, authority, readOnlyReason]
          properties:
            controllerEmploymentId: { type: [string, "null"] }
            controllerCompanyId: { type: [string, "null"] }
            canWrite: { type: boolean }
            authority: { type: [string, "null"], enum: [developer, publisher, company, null] }
            readOnlyReason: { type: [string, "null"] }
        assets:
          type: object
          required: [avatar, image2d, model3d]
          properties:
            avatar: { type: array, items: { $ref: "#/components/schemas/AppearanceAsset" } }
            image2d:
              { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AppearanceAsset" } }
            model3d: { type: array, items: { $ref: "#/components/schemas/AppearanceAsset" } }
        presentation: { type: object }
        updatedAt: { type: [string, "null"], format: date-time }
    SidebarIcon:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, iconId]
          properties:
            type: { type: string, const: builtin }
            iconId: { type: string, maxLength: 64 }
        - type: object
          additionalProperties: false
          required: [type, assetId]
          properties:
            type: { type: string, const: asset }
            assetId: { type: string, format: uuid }
    SidebarItem:
      type: object
      additionalProperties: false
      required: [itemId, type, order, label, visible, icon]
      properties:
        itemId: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [system, route, template] }
        order: { type: integer, minimum: 0 }
        label: { type: string, minLength: 1, maxLength: 80 }
        visible: { type: boolean }
        icon: { $ref: "#/components/schemas/SidebarIcon" }
        routeId: { type: string, maxLength: 128 }
        templateId: { type: string, format: uuid }
    SidebarConfig:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion: { type: integer, const: 1 }
        items:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/SidebarItem" }
    SidebarPreference:
      type: object
      required: [overridden, config, revision]
      properties:
        overridden: { type: boolean }
        config:
          oneOf:
            - $ref: "#/components/schemas/SidebarConfig"
            - type: "null"
        revision: { type: string, pattern: "^[0-9]+$" }
        updatedAt: { type: [string, "null"], format: date-time }
    TemplatePricing:
      type: object
      required: [mode, priceMicros, currency, purchaseSupported]
      properties:
        mode: { type: string, enum: [free, paid] }
        priceMicros: { type: [string, "null"], pattern: "^[0-9]+$" }
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
        purchaseSupported: { type: boolean, const: false }
    DesktopTemplate:
      type: object
      required: [id, publisher, slug, name, description, status, pricing, entitled, activeVersion]
      properties:
        id: { type: string, format: uuid }
        publisher:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        pricing: { $ref: "#/components/schemas/TemplatePricing" }
        entitled: { type: boolean }
        activeVersion: { type: [object, "null"] }
        updatedAt: { type: string, format: date-time }
    CreateTemplate:
      type: object
      additionalProperties: false
      required: [publisherId, slug, name, description, pricingMode]
      properties:
        publisherId: { type: string, maxLength: 191 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        pricingMode: { type: string, enum: [free, paid] }
        priceMicros: { type: [integer, "null"], minimum: 0 }
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
    UpdateTemplate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        pricingMode: { type: string, enum: [free, paid] }
        priceMicros: { type: [integer, "null"], minimum: 0 }
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
  responses:
    AuthRequired:
      description: JWT 缺失、无效或已过期
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ForbiddenScope:
      description: 当前登录用户缺少所需的资源权限范围
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: 资源不存在，或当前账号不可见
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: 请求参数校验失败
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: 状态、所有权、唯一性、数量限制或资源占用冲突
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RevisionConflict:
      description: If-Match 修订版本已过期；details 包含 currentRevision 和 etag
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionRequired:
      description: 必须提供有效的 If-Match 请求头
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AssetTooLarge:
      description: 上传内容超过该资源类型的大小限制
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: 声明的类型、扩展名或检测到的文件魔数不受支持
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EntitlementRequired:
      description: 下载付费模板需要有效权益；在线购买当前不可用
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
