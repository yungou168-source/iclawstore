; =============================================
; ClawHub 项目说明 (2026-06-09)
; 更新: 2026-06-27 - 添加 MySQL 迁移计划
; =============================================

[项目概览]
项目名称 = ClawHub (即 iclawstore.com)
官方站点 = https://clawhub.ai
项目类型 = 开源公开技能注册表 (Public Skill Registry for OpenClaw)
开发仓库 = https://github.com/yungou168-source/iclawstore.git
上游仓库 = https://github.com/openclaw/clawhub
许可证 = MIT

[核心功能]
- 发布、版本管理、搜索基于文本的 AI Agent 技能 (SKILL.md + 配套文件)
- 向量搜索 (OpenAI text-embedding-3-small + Convex vector search)
- OpenClaw 代码插件原生包目录 (OpenClaw package catalog)
- GitHub OAuth 登录、收藏、评论等社区功能
- CLI 工具 (clawhub) 用于发布、安装、搜索技能

[技术栈]
前端框架 = TanStack Start (React + Vite/Nitro)
后端 = Convex (数据库 + 文件存储 + HTTP actions)
身份认证 = Convex Auth (GitHub OAuth)
搜索引擎 = OpenAI embeddings + Convex vector search
包管理/运行时 = Bun
编程语言 = TypeScript (严格模式, ESM)

[目录结构]
src/          = TanStack Start 应用代码 (路由、组件、样式)
convex/       = Convex 后端 (schema、queries/mutations/actions、HTTP 路由)
convex/_generated/ = 生成的 Convex API/类型 (提交到仓库用于构建)
packages/schema/   = 共享 API 类型/路由 (CLI 和应用共用)
docs/         = 用户/运维文档
specs/        = 产品规格、回归说明、设计历史
public/       = 静态资源

[功能说明]
; 部署后能给用户提供什么功能
面向普通用户 = 浏览/搜索技能库(向量语义搜索)、收藏、评论、注册登录(GitHub OAuth)、查看发布者主页、多语言切换(简体中文/英文)
面向开发者 = 发布技能版本、重命名/合并技能、发布OpenClaw代码插件包
面向包生态 = 浏览OpenClaw包目录、发布原生代码插件和bundle插件
面向管理员 = 审核(moderation)、封禁、申诉、安全扫描、全局统计数据维护

[前端技术栈]
编程语言 = TypeScript (严格模式, ESM)
UI框架 = React 19
路由框架 = TanStack Start (底层 Vite + Nitro)
UI组件库 = Radix UI
样式 = TailwindCSS
代码编辑器 = Monaco Editor (用于展示技能内容)
运行时 = Bun
国际化 = 支持简体中文/英文切换，默认简体中文

[数据更新机制]
非全自动爬虫，而是用户主动推送机制：
  - 手动发布: clawhub skill publish <path> / clawhub package publish <source>
  - GitHub同步: clawhub sync 将本地已安装技能同步到远程(需登录，含遥测)
  - GitHub导入: 支持从GitHub仓库直接导入技能
  - GitHub源同步: Convex后端定时/触发性从GitHub拉取技能源文件
  - 安全扫描: 发布时自动运行Plugin Inspector扫描
结论 = 非实时自动抓取，用户主动推送或CLI同步

[数据库]
不使用传统数据库，使用 Convex 作为一体化后端：
  - Convex = 数据库(文档型，支持索引) + 文件存储 + 后端函数 + HTTP API + 认证
  - 数据存储在 Convex Cloud (SaaS化)
  - 支持向量搜索(embedding索引)
  - 不需要单独的 PostgreSQL/MySQL/MongoDB
  - 前端通过 ConvexHttpClient(一次性) 或 useQuery(响应式) 访问后端

