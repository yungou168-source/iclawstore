- Vite 开发服务器需要配置 allowedHosts 才能通过域名访问
- 已添加多语言支持(i18n)，默认语言为简体中文

[二开修改流程]
1. 进入项目目录: cd /www/wwwroot/iclawstore.com
2. 安装依赖: bun install
3. 本地开发: bun run dev (http://localhost:3000)
4. 修改代码后重新构建: bun run build
5. 重启服务: pm2 restart iclawstore
注: 本服务器为自托管部署(Bun+PM2+Nginx)，非 Vercel 部署

[本地开发命令]
bun install              = 安装依赖
bun run dev              = 本地开发服务器 (http://localhost:3000)
bunx convex dev          = 启动本地 Convex 后端
bun run build            = 生产构建
bun run seed:dev         = 填充本地测试数据

[生产部署说明]
生产部署为手动操作, 合并到 main 分支不会自动部署。
发布流程: gh workflow run deploy.yml --repo openclaw/clawhub --ref main
生产环境使用 Vercel (前端) + Convex Cloud (后端)
需配置的环境变量:
  - VITE_CONVEX_URL         = Convex 部署 URL (https://<deployment>.convex.cloud)
  - VITE_CONVEX_SITE_URL    = Convex site URL (https://<deployment>.convex.site)
  - CONVEX_DEPLOY_KEY       = Convex 部署密钥 (生产环境 secret)
  - AUTH_GITHUB_ID/SECRET   = GitHub OAuth App 凭证
  - JWT_PRIVATE_KEY/JWKS    = Convex Auth 密钥对
  - OPENAI_API_KEY          = OpenAI API 密钥 (用于 embeddings)

详细开发环境配置请参考 CONTRIBUTING.md 和 docs/ 目录下的文档。

[Ubuntu 24.04 安装步骤]
; 2026-06-25 系统升级后完整安装流程

1. 安装 Node.js 20+:
   curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
   sudo apt install -y nodejs

2. 安装 Bun (用户目录):
   npm install -g bun --prefix ~/.local
   export PATH="$HOME/.local/bin:$PATH"

3. 安装 PM2 (用户目录):
   npm install -g pm2 --prefix ~/.local
   export PATH="$HOME/.local/bin:$PATH"

4. 安装软件:
   sudo apt install -y nginx openssl

5. 恢复网站文件:
   - 源码: /www/wwwroot/iclawstore.com/
   - 环境变量: .env.local

6. 配置 Nginx:
   - 主配置: /www/server/nginx/conf/nginx.conf
   - 站点配置: /www/server/nginx/conf/vhost/iclawstore.com.conf
   - SSL 证书: /www/server/panel/vhost/cert/iclawstore.com/

7. 启动服务:
   export PATH="$HOME/.local/bin:$PATH"
   cd /www/wwwroot/iclawstore.com
   pm2 start ecosystem.config.cjs
   pm2 save
   sudo nginx -c /www/server/nginx/conf/nginx.conf

8. 验证:
   curl -sI https://www.iclawstore.com

[MySQL迁移计划] ⚙️ 进行中 (2026-06-27)
; 将 Convex 迁移到自托管 MySQL + Fastify 后端

[迁移决策]
不使用国内登录方式，仅保留 GitHub OAuth 登录
保留 Convex ID 格式以最小化代码改动
使用 MySQL FULLTEXT + Meilisearch 替代 Convex 向量搜索

[迁移步骤]
1. 初始化 Git 仓库并关联 GitHub
2. 准备迁移环境 (Node.js 20+ / MySQL 8.0+ / Meilisearch)
3. 导出 Convex 数据 (通过 convex data export 或 API)
4. 创建 MySQL Schema (用户/技能/版本/评论/收藏等表)
5. 执行数据迁移 (编写迁移脚本)
6. 开发后端 API (Fastify + Prisma)
7. 配置搜索服务 (Meilisearch 替代向量搜索)
8. 重构前端 API 层 (ConvexHttpClient → Fastify API)
9. 测试和部署

[技术方案]
数据库 = MySQL 8.0+ (替代 Convex)
ORM = Prisma (数据库访问)
后端 = Fastify (Node.js HTTP 服务)
搜索 = Meilisearch (全文搜索 + 语义搜索)
文件存储 = 本地文件系统 (替代 Convex file storage)
认证 = GitHub OAuth (保留)

[目录结构变更]
src/           = TanStack Start 应用代码 (不变)
convex/        = 将迁移到 server/ 或 api/ 目录
server/        = Fastify 后端代码 (新增)
prisma/        = Prisma schema 和迁移 (新增)
migrations/     = 数据迁移脚本 (新增)

[关键表设计]
users          = 用户表 (GitHub OAuth)
skills         = 技能表
skill_versions = 技能版本表
comments       = 评论表
stars          = 收藏表
packages       = 包表 (OpenClaw packages)
scans          = 安全扫描记录表

[环境变量新增]
DATABASE_URL          = mysql://user:pass@localhost:3306/iclawstore
MEILISEARCH_HOST      = http://localhost:7700
MEILISEARCH_API_KEY   = (master key)
JWT_SECRET           = (会话密钥)

[部署架构变更]
; 迁移前 (Convex SaaS)
客户端 → Nginx → Nitro SSR → Convex Cloud

; 迁移后 (自托管)
客户端 → Nginx → Nitro SSR → Fastify API → MySQL
                                          ↓
                                    Meilisearch

[风险和注意事项]
1. Convex 数据导出限制 - 可能需要逐表查询导出
2. 向量搜索迁移 - Meilisearch 需要重新建立索引
3. 实时功能丢失 - Convex 响应式订阅需要重构
4. 文件存储迁移 - Convex 文件需要下载到本地
5. 保持兼容 - 尽量保留原有 API 接口格式
